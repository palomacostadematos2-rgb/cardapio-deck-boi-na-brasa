<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140f0c" />

    <!--
      As tags abaixo marcadas com data-default="true" são o fallback
      estático lido por crawlers que não executam JavaScript (ex.: preview
      do WhatsApp). Assim que o React monta, App.tsx as remove e o
      react-helmet-async passa a controlar título/description/canonical/
      Open Graph/Twitter Card dinamicamente por página (src/components/common/Seo.tsx).
    -->
    <title data-default="true">Cardápio | Deck Boi na Brasa Grill</title>
    <meta
      data-default="true"
      name="description"
      content="Cardápio digital do Deck Boi na Brasa Grill: cervejas artesanais, drinks autorais, petiscos e porções em um ambiente de churrascaria mineira, madeira e brasa."
    />
    <meta
      name="keywords"
      content="cardápio digital, churrascaria, restaurante, bar, Deck Boi na Brasa, Castelo, comida mineira"
    />
    <link data-default="true" rel="canonical" href="%VITE_APP_URL%/cardapio" />

    <meta data-default="true" property="og:type" content="website" />
    <meta
      data-default="true"
      property="og:site_name"
      content="Deck Boi na Brasa Grill"
    />
    <meta
      data-default="true"
      property="og:title"
      content="Cardápio | Deck Boi na Brasa Grill"
    />
    <meta
      data-default="true"
      property="og:description"
      content="Cervejas artesanais, drinks autorais, petiscos e porções em um ambiente de churrascaria mineira, madeira e brasa."
    />
    <meta
      data-default="true"
      property="og:url"
      content="%VITE_APP_URL%/cardapio"
    />
    <meta
      data-default="true"
      property="og:image"
      content="%VITE_APP_URL%/og-image.jpg"
    />
    <meta data-default="true" property="og:image:width" content="1200" />
    <meta data-default="true" property="og:image:height" content="630" />
    <meta data-default="true" property="og:locale" content="pt_BR" />

    <meta
      data-default="true"
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      data-default="true"
      name="twitter:title"
      content="Cardápio | Deck Boi na Brasa Grill"
    />
    <meta
      data-default="true"
      name="twitter:description"
      content="Cervejas artesanais, drinks autorais, petiscos e porções em um ambiente de churrascaria mineira, madeira e brasa."
    />
    <meta
      data-default="true"
      name="twitter:image"
      content="%VITE_APP_URL%/og-image.jpg"
    />

    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
